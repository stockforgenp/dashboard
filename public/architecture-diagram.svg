<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1713" />
      <stop offset="100%" stop-color="#070a08" />
    </linearGradient>
    <linearGradient id="cloud-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="local-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.08" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" rx="16" fill="url(#bg)" stroke="#262626" stroke-width="1.5" />

  <!-- Title bar -->
  <g transform="translate(40, 45)">
    <rect width="36" height="36" rx="8" fill="#10b981" fill-opacity="0.2" />
    <path d="M10 14h16v3H10zm0 5h16v3H10zm0 5h11v3H10z" fill="#34d399" />
    <text x="48" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#f5f5f5">Why Offline-First Matters in Nepal Retail</text>
    <text x="48" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#9ca3af">Eliminating network downtime, cloud lag, and festival rush counter freezes</text>
  </g>

  <!-- Comparison Columns -->
  <!-- Left Column: Legacy Cloud POS -->
  <g transform="translate(40, 110)">
    <rect width="390" height="330" rx="12" fill="url(#cloud-grad)" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1.5" />
    
    <!-- Header -->
    <rect x="20" y="20" width="130" height="26" rx="13" fill="#ef4444" fill-opacity="0.15" />
    <text x="32" y="37" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#f87171">LEGACY CLOUD POS</text>

    <text x="20" y="75" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#fca5a5">Dependent on Constant Internet</text>
    <text x="20" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#9ca3af">Every barcode scan sends request to distant server</text>

    <!-- Flow items -->
    <g transform="translate(20, 125)">
      <!-- Item 1 -->
      <circle cx="12" cy="12" r="10" fill="#ef4444" fill-opacity="0.2" />
      <text x="12" y="16" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ef4444" text-anchor="middle">✕</text>
      <text x="32" y="16" font-family="sans-serif" font-size="13" font-weight="600" fill="#e5e5e5">500ms – 4000ms Latency</text>
      <text x="32" y="34" font-family="sans-serif" font-size="11" fill="#737373">Slow barcode processing delays long customer lines</text>

      <!-- Item 2 -->
      <g transform="translate(0, 55)">
        <circle cx="12" cy="12" r="10" fill="#ef4444" fill-opacity="0.2" />
        <text x="12" y="16" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ef4444" text-anchor="middle">✕</text>
        <text x="32" y="16" font-family="sans-serif" font-size="13" font-weight="600" fill="#e5e5e5">Festival Rush Network Blackouts</text>
        <text x="32" y="34" font-family="sans-serif" font-size="11" fill="#737373">Cellular congestion freezes checkout completely</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 110)">
        <circle cx="12" cy="12" r="10" fill="#ef4444" fill-opacity="0.2" />
        <text x="12" y="16" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ef4444" text-anchor="middle">✕</text>
        <text x="32" y="16" font-family="sans-serif" font-size="13" font-weight="600" fill="#e5e5e5">Third-Party Cloud Lock-In</text>
        <text x="32" y="34" font-family="sans-serif" font-size="11" fill="#737373">Forced monthly subscriptions; data hosted remotely</text>
      </g>
    </g>
  </g>

  <!-- Right Column: StockForge Offline SQLite WASM -->
  <g transform="translate(470, 110)">
    <rect width="390" height="330" rx="12" fill="url(#local-grad)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5" />
    
    <!-- Header -->
    <rect x="20" y="20" width="165" height="26" rx="13" fill="#10b981" fill-opacity="0.2" />
    <text x="32" y="37" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#34d399">STOCKFORGE WASM ENGINE</text>

    <text x="20" y="75" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#a7f3d0">100% In-Browser SQLite Local Storage</text>
    <text x="20" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#9ca3af">All sales, inventory, and Khata persist locally on device</text>

    <!-- Flow items -->
    <g transform="translate(20, 125)">
      <!-- Item 1 -->
      <circle cx="12" cy="12" r="10" fill="#10b981" fill-opacity="0.2" />
      <text x="12" y="16" font-family="sans-serif" font-size="12" font-weight="bold" fill="#10b981" text-anchor="middle">✓</text>
      <text x="32" y="16" font-family="sans-serif" font-size="13" font-weight="600" fill="#e5e5e5">0ms Instant Transaction Speed</text>
      <text x="32" y="34" font-family="sans-serif" font-size="11" fill="#737373">Sub-millisecond query execution right in the browser</text>

      <!-- Item 2 -->
      <g transform="translate(0, 55)">
        <circle cx="12" cy="12" r="10" fill="#10b981" fill-opacity="0.2" />
        <text x="12" y="16" font-family="sans-serif" font-size="12" font-weight="bold" fill="#10b981" text-anchor="middle">✓</text>
        <text x="32" y="16" font-family="sans-serif" font-size="13" font-weight="600" fill="#e5e5e5">100% Internet Independence</text>
        <text x="32" y="34" font-family="sans-serif" font-size="11" fill="#737373">Zero sales lost during load shedding or network drops</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 110)">
        <circle cx="12" cy="12" r="10" fill="#10b981" fill-opacity="0.2" />
        <text x="12" y="16" font-family="sans-serif" font-size="12" font-weight="bold" fill="#10b981" text-anchor="middle">✓</text>
        <text x="32" y="16" font-family="sans-serif" font-size="13" font-weight="600" fill="#e5e5e5">Total Data Sovereignty &amp; Backups</text>
        <text x="32" y="34" font-family="sans-serif" font-size="11" fill="#737373">1-click .db, .sql, and Google Sheets cloud exports</text>
      </g>
    </g>
  </g>
</svg>
