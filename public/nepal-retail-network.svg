<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400">
  <defs>
    <linearGradient id="bg-net" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c120f" />
      <stop offset="100%" stop-color="#070a08" />
    </linearGradient>
    <linearGradient id="hub-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16221c" />
      <stop offset="100%" stop-color="#101814" />
    </linearGradient>
  </defs>

  <rect width="920" height="400" rx="16" fill="url(#bg-net)" stroke="#262626" stroke-width="1.5" />

  <!-- Title bar -->
  <g transform="translate(48, 36)">
    <rect width="32" height="32" rx="8" fill="#10b981" fill-opacity="0.15" />
    <circle cx="16" cy="16" r="6" fill="#34d399" />
    <text x="44" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#f5f5f5">Decentralized Retail Architecture in Nepal</text>
    <text x="44" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#9ca3af">Each shop operates as an autonomous, self-sufficient offline SQLite node with zero server dependencies</text>
  </g>

  <!-- Network Map visualization -->
  <g transform="translate(48, 95)">
    <!-- Hub 1: Kathmandu Valley Core -->
    <g transform="translate(0, 0)">
      <rect width="260" height="255" rx="12" fill="url(#card-bg)" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5" />
      <rect x="18" y="18" width="40" height="40" rx="10" fill="#10b981" fill-opacity="0.2" />
      <text x="38" y="43" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800" fill="#34d399" text-anchor="middle">KTM</text>
      
      <text x="18" y="82" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800" fill="#f5f5f5">Kathmandu Valley</text>
      <text x="18" y="102" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#34d399">New Road · Asan · Patan · Bhaktapur</text>
      
      <text x="18" y="132" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#9ca3af">
        <tspan x="18" dy="0">High-density grocery marts,</tspan>
        <tspan x="18" dy="16">supermarkets, and busy</tspan>
        <tspan x="18" dy="16">commercial bazaar counters.</tspan>
        <tspan x="18" dy="16">Processed 150,000+ sales</tspan>
        <tspan x="18" dy="16">without a single drop.</tspan>
      </text>

      <rect x="18" y="215" width="224" height="24" rx="6" fill="#10b981" fill-opacity="0.1" />
      <text x="130" y="231" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">210+ Active Stores</text>
    </g>

    <!-- Hub 2: Regional Commercial Centers -->
    <g transform="translate(282, 0)">
      <rect width="260" height="255" rx="12" fill="url(#card-bg)" stroke="#14b8a6" stroke-opacity="0.3" stroke-width="1.5" />
      <rect x="18" y="18" width="40" height="40" rx="10" fill="#14b8a6" fill-opacity="0.2" />
      <text x="38" y="43" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800" fill="#2dd4bf" text-anchor="middle">PKR</text>
      
      <text x="18" y="82" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800" fill="#f5f5f5">Western Hubs</text>
      <text x="18" y="102" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#2dd4bf">Pokhara · Butwal · Chitwan</text>
      
      <text x="18" y="132" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#9ca3af">
        <tspan x="18" dy="0">Dairy co-operatives, hardware</tspan>
        <tspan x="18" dy="16">suppliers, and regional marts.</tspan>
        <tspan x="18" dy="16">Flawless multi-unit sales</tspan>
        <tspan x="18" dy="16">in kg and litre during</tspan>
        <tspan x="18" dy="16">intermittent connectivity.</tspan>
      </text>

      <rect x="18" y="215" width="224" height="24" rx="6" fill="#14b8a6" fill-opacity="0.1" />
      <text x="130" y="231" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#2dd4bf" text-anchor="middle">140+ Active Stores</text>
    </g>

    <!-- Hub 3: Architecture Guarantees -->
    <g transform="translate(564, 0)">
      <rect width="260" height="255" rx="12" fill="url(#card-bg)" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1.5" />
      <rect x="18" y="18" width="40" height="40" rx="10" fill="#06b6d4" fill-opacity="0.2" />
      <text x="38" y="43" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800" fill="#22d3ee" text-anchor="middle">ACID</text>
      
      <text x="18" y="82" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800" fill="#f5f5f5">Autonomous Nodes</text>
      <text x="18" y="102" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#22d3ee">100% Local Device Storage</text>
      
      <text x="18" y="132" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#9ca3af">
        <tspan x="18" dy="0">No central server that can crash.</tspan>
        <tspan x="18" dy="16">No monthly hostage fee.</tspan>
        <tspan x="18" dy="16">Optional 1-click Google</tspan>
        <tspan x="18" dy="16">Sheets and .sql database</tspan>
        <tspan x="18" dy="16">backups under your control.</tspan>
      </text>

      <rect x="18" y="215" width="224" height="24" rx="6" fill="#06b6d4" fill-opacity="0.1" />
      <text x="130" y="231" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#22d3ee" text-anchor="middle">Zero Central Vulnerability</text>
    </g>
  </g>
</svg>
