<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="50%" stop-color="#141c18" />
      <stop offset="100%" stop-color="#070a08" />
    </linearGradient>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2924" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#141f1a" stop-opacity="0.6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />

  <!-- Subtle glow accents -->
  <circle cx="150" cy="120" r="240" fill="#10b981" opacity="0.12" filter="url(#glow)" />
  <circle cx="1050" cy="510" r="300" fill="#0d9488" opacity="0.15" filter="url(#glow)" />

  <!-- Grid lines overlay -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Content Container -->
  <g transform="translate(80, 80)">
    <!-- Brand Logo and Badge -->
    <g>
      <rect width="64" height="64" rx="16" fill="url(#brand-grad)" />
      <!-- Store icon -->
      <path d="M18 24h28l-3 7H21l-3-7z M23 31h18v7H23v-7zm-5 7h28l3 10H15l3-10z" fill="#ffffff" />
      
      <text x="82" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">StockForge</text>
      <text x="82" y="58" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#34d399">OFFLINE RETAIL POS &amp; INVENTORY ENGINE</text>
    </g>

    <!-- Main Headline -->
    <text x="0" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">
      Zero-Latency Offline Retail POS
    </text>
    <text x="0" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#34d399" letter-spacing="-1">
      Built for Modern Storefronts.
    </text>

    <!-- Subtitle / Value proposition -->
    <text x="0" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#9ca3af" letter-spacing="0.2">
      100% in-browser SQLite WebAssembly · Multi-unit inventory (kg, litre, pcs)
    </text>
    <text x="0" y="328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#9ca3af" letter-spacing="0.2">
      Sequential bill numbering · Customer Khata credit · Google Sheets &amp; SQL backup
    </text>

    <!-- Pill Badges Row -->
    <g transform="translate(0, 390)">
      <!-- Badge 1: 100% Offline -->
      <rect x="0" y="0" width="220" height="46" rx="23" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5" />
      <circle cx="24" cy="23" r="6" fill="#10b981" />
      <text x="40" y="29" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#34d399">100% Offline WASM</text>

      <!-- Badge 2: Multi-Unit -->
      <rect x="236" y="0" width="230" height="46" rx="23" fill="#14b8a6" fill-opacity="0.15" stroke="#14b8a6" stroke-opacity="0.4" stroke-width="1.5" />
      <circle cx="260" cy="23" r="6" fill="#14b8a6" />
      <text x="276" y="29" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#2dd4bf">Multi-Unit Control</text>

      <!-- Badge 3: Customer Khata -->
      <rect x="482" y="0" width="220" height="46" rx="23" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1.5" />
      <circle cx="506" cy="23" r="6" fill="#06b6d4" />
      <text x="522" y="29" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#22d3ee">Customer Khata</text>

      <!-- Badge 4: Bilingual -->
      <rect x="718" y="0" width="240" height="46" rx="23" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.5" />
      <circle cx="742" cy="23" r="6" fill="#f59e0b" />
      <text x="758" y="29" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#fbbf24">English &amp; नेपाली Switch</text>
    </g>
  </g>
</svg>
