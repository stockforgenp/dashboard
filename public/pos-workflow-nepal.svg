<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420">
  <defs>
    <linearGradient id="bg-flow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f0d" />
      <stop offset="100%" stop-color="#050706" />
    </linearGradient>
    <linearGradient id="node-active" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="node-box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18231e" />
      <stop offset="100%" stop-color="#121a16" />
    </linearGradient>
  </defs>

  <!-- Background container -->
  <rect width="960" height="420" rx="16" fill="url(#bg-flow)" stroke="#262626" stroke-width="1.5" />

  <!-- Section Header -->
  <g transform="translate(48, 40)">
    <rect width="32" height="32" rx="8" fill="#10b981" fill-opacity="0.15" />
    <path d="M9 16h14M16 9l7 7-7 7" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="44" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#f5f5f5">High-Speed Offline Retail Checkout Flow in Nepal</text>
    <text x="44" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#9ca3af">From barcode scan to 0ms local SQLite commit and instant 80mm/58mm thermal print</text>
  </g>

  <!-- Flow Steps (4 Interactive Nodes) -->
  <g transform="translate(48, 105)">
    <!-- Step 1: Scan & Weigh -->
    <g transform="translate(0, 0)">
      <rect width="195" height="240" rx="12" fill="url(#node-box)" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5" />
      <rect x="16" y="16" width="36" height="36" rx="8" fill="#10b981" fill-opacity="0.2" />
      <text x="34" y="39" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" fill="#34d399" text-anchor="middle">01</text>
      
      <text x="16" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#f5f5f5">Barcode &amp; Units</text>
      <text x="16" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#34d399" font-weight="600">kg · litre · pcs · packet</text>
      
      <text x="16" y="128" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#9ca3af" line-height="1.4">
        <tspan x="16" dy="0">Instant scan with 1D/2D</tspan>
        <tspan x="16" dy="16">handheld scanners or</tspan>
        <tspan x="16" dy="16">quick SKU keypad search.</tspan>
        <tspan x="16" dy="16">Fractional quantities</tspan>
        <tspan x="16" dy="16">supported (e.g. 1.25 kg).</tspan>
      </text>

      <rect x="16" y="196" width="163" height="26" rx="6" fill="#10b981" fill-opacity="0.1" />
      <text x="97" y="213" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">&lt; 1 millisecond</text>
    </g>

    <!-- Connector 1 -->
    <path d="M200 120 L220 120" stroke="#34d399" stroke-width="2" stroke-dasharray="4 3" opacity="0.6" />
    <polygon points="222,120 216,116 216,124" fill="#34d399" opacity="0.8" />

    <!-- Step 2: Sequential Invoicing -->
    <g transform="translate(225, 0)">
      <rect width="195" height="240" rx="12" fill="url(#node-box)" stroke="#14b8a6" stroke-opacity="0.3" stroke-width="1.5" />
      <rect x="16" y="16" width="36" height="36" rx="8" fill="#14b8a6" fill-opacity="0.2" />
      <text x="34" y="39" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" fill="#2dd4bf" text-anchor="middle">02</text>
      
      <text x="16" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#f5f5f5">Sequential Bill</text>
      <text x="16" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#2dd4bf" font-weight="600">BILL-YYYYMMDD-XXXX</text>
      
      <text x="16" y="128" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#9ca3af">
        <tspan x="16" dy="0">Automated consecutive</tspan>
        <tspan x="16" dy="16">bill numbering, line-item</tspan>
        <tspan x="16" dy="16">discounts, customer</tspan>
        <tspan x="16" dy="16">credit Khata tracking, and</tspan>
        <tspan x="16" dy="16">exact subtotal ledger.</tspan>
      </text>

      <rect x="16" y="196" width="163" height="26" rx="6" fill="#14b8a6" fill-opacity="0.1" />
      <text x="97" y="213" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#2dd4bf" text-anchor="middle">Atomic numbering</text>
    </g>

    <!-- Connector 2 -->
    <path d="M425 120 L445 120" stroke="#14b8a6" stroke-width="2" stroke-dasharray="4 3" opacity="0.6" />
    <polygon points="447,120 441,116 441,124" fill="#14b8a6" opacity="0.8" />

    <!-- Step 3: SQLite WASM Commit -->
    <g transform="translate(450, 0)">
      <rect width="195" height="240" rx="12" fill="url(#node-box)" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1.5" />
      <rect x="16" y="16" width="36" height="36" rx="8" fill="#06b6d4" fill-opacity="0.2" />
      <text x="34" y="39" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" fill="#22d3ee" text-anchor="middle">03</text>
      
      <text x="16" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#f5f5f5">ACID SQLite Commit</text>
      <text x="16" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#22d3ee" font-weight="600">Zero Cloud Latency</text>
      
      <text x="16" y="128" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#9ca3af">
        <tspan x="16" dy="0">Transaction committed</tspan>
        <tspan x="16" dy="16">directly to local disk</tspan>
        <tspan x="16" dy="16">via IndexedDB and WASM.</tspan>
        <tspan x="16" dy="16">Zero internet required.</tspan>
        <tspan x="16" dy="16">Stock decrements instantly.</tspan>
      </text>

      <rect x="16" y="196" width="163" height="26" rx="6" fill="#06b6d4" fill-opacity="0.1" />
      <text x="97" y="213" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#22d3ee" text-anchor="middle">0ms Network Lag</text>
    </g>

    <!-- Connector 3 -->
    <path d="M650 120 L670 120" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4 3" opacity="0.6" />
    <polygon points="672,120 666,116 666,124" fill="#06b6d4" opacity="0.8" />

    <!-- Step 4: Thermal Receipt Print -->
    <g transform="translate(675, 0)">
      <rect width="190" height="240" rx="12" fill="url(#node-box)" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.5" />
      <rect x="16" y="16" width="36" height="36" rx="8" fill="#f59e0b" fill-opacity="0.2" />
      <text x="34" y="39" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" fill="#fbbf24" text-anchor="middle">04</text>
      
      <text x="16" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#f5f5f5">Thermal Receipt</text>
      <text x="16" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#fbbf24" font-weight="600">80mm &amp; 58mm Paper</text>
      
      <text x="16" y="128" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#9ca3af">
        <tspan x="16" dy="0">Hardware ESC/POS &amp;</tspan>
        <tspan x="16" dy="16">CSS print stylesheets</tspan>
        <tspan x="16" dy="16">with store header, unit</tspan>
        <tspan x="16" dy="16">breakdown, consecutive #,</tspan>
        <tspan x="16" dy="16">and customer Khata bal.</tspan>
      </text>

      <rect x="16" y="196" width="158" height="26" rx="6" fill="#f59e0b" fill-opacity="0.1" />
      <text x="95" y="213" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#fbbf24" text-anchor="middle">Instant Printout</text>
    </g>
  </g>
</svg>
